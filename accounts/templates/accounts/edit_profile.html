{% extends "base.html" %}
{% load static %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="mb-4 fw-bold">Edit Your Profile</h1>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                {{ form.non_field_errors }}

                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ field.label }}</label>
                    {{ field }}
                    <div class="text-danger small">{{ field.errors }}</div>
                </div>
                {% endfor %}

                <button class="btn btn-primary btn-lg px-4">Save Changes</button>

                <a href="{% url 'delete_profile' %}" class="btn btn-outline-danger mt-3">
                    Delete Profile
                </a>

            </form>

        </div>
    </div>
</div>
{% endblock %}
